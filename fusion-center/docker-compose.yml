# Déploiement de référence : API + PostgreSQL. Pour une démo rapide sans Postgres : `make dev`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fusion
      POSTGRES_USER: fusion
      POSTGRES_PASSWORD: ${FC_DB_PASSWORD:-changeme}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fusion"], interval: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      FC_DATABASE_URL: postgresql+psycopg://fusion:${FC_DB_PASSWORD:-changeme}@db:5432/fusion
      FC_SECRET_KEY: ${FC_SECRET_KEY:?Définir FC_SECRET_KEY (64 caractères aléatoires)}
      FC_ADMIN_PASSWORD: ${FC_ADMIN_PASSWORD:-admin123}
      FC_SEED_DEMO: ${FC_SEED_DEMO:-true}
      FC_ENVIRONMENT: production
      FC_CORS_ORIGINS: '[]'
    ports: ["8000:8000"]
volumes:
  pgdata:
