# WawID — site Netlify autonome (répertoire de base : wawid/)
[build]
  publish = "public"
  command = "npm run build && npm test"
  [build.environment]
    NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/gate/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/app/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=WawID-eVisa-android.apk"

[[headers]]
  for = "/compagnies/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Plateformes dissociées : /dpaf/ (espace DPAF, alias de /admin/), /compagnies/ (compagnies aériennes),
# / (voyageurs), /app/ (applications mobiles). En production, chacune peut recevoir son propre domaine.
[[redirects]]
  from = "/dpaf"
  to = "/dpaf/"
  status = 301

[[redirects]]
  from = "/dpaf/*"
  to = "/admin/:splat"
  status = 200
