<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WawID App mobile</title>
<meta name="description" content="Application WawID e-Visa pour iPhone et Android : installation et test.">
<link rel="icon" href="../shared/wawid-icon.svg?v=3" type="image/svg+xml">
<link rel="stylesheet" href="../shared/ui.css">
<link rel="stylesheet" href="../portal.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  .dl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .dl-card { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .dl-card h2 { margin: 0; font-size: 20px; }
  .dl-card ol { margin: 0; padding-left: 20px; line-height: 1.6; }
  .dl-qr { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .dl-qr > svg { width: 150px; height: 150px; background: #fff; padding: 8px; border-radius: 8px; }
</style>
<script type="module" src="app.js"></script>
</head>
<body>
<div id="app"></div>
</body>
</html>
